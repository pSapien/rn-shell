			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Type a script or drag a script file from your workspace to insert its path.\nTARGET_PLIST=${BUILT_PRODUCTS_DIR}/${INFOPLIST_PATH}\n\nPLISTBUDDY=\"/usr/libexec/PlistBuddy\"\n\n# Remove any custom fonts to avoid conflict\n$PLISTBUDDY -c \"Delete :UIAppFonts\" \"$TARGET_PLIST\"\n\n# Create an empty font list\n$PLISTBUDDY -c \"Add :UIAppFonts array\" \"$TARGET_PLIST\"\n\n# Link all resources in the assets folder\nRESOURCE_SRC=\"$SRCROOT/../assets/\"\nTARGET_DIR=\"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/assets/\"\nif [ -e \"$RESOURCE_SRC\" ]; then\n  mkdir -p $TARGET_DIR\n  rsync -rtv --copy-unsafe-links \"$RESOURCE_SRC/\" \"$TARGET_DIR\"\n  echo \"Successfully injected resource into app bundle: $RESOURCE_SRC\"\nelse\n  echo \"Warning: Resource source path not found: $RESOURCE_SRC\"\nfi\n\nL=${#RESOURCE_SRC}\nfor path in $(find -L \"$RESOURCE_SRC\" -type f -name \"*.ttf\" -o -name \"*.otf\"); do\n  FONT_FILE=\"assets/${path:$L}\"\n  echo \"Creating entry for font file: $FONT_FILE\"\n  \n  $PLISTBUDDY -c \"Add :UIAppFonts: string $FONT_FILE\" \"$TARGET_PLIST\"\ndone\n\necho \"Bundling external assets/fonts completed.\"\n# Search for all font files within \n# FONT_NAME=\"Ionicons.ttf\"\n# $PLISTBUDDY -c \"Add :UIAppFonts: string $FONT_NAME\" \"$TARGET_PLIST\"\n\n\n# Run script to update entitlement for applinks (universal link) and deep link\nXCODE_ENV=\"${SRCROOT}/.xcode.env\"\nXCODE_ENV_LOCAL=\"${SRCROOT}/.xcode.env.local\"\n# Source the primary environment file if it exists\nif [ -f \"$XCODE_ENV\" ]; then\n  source \"$XCODE_ENV\"\nfi\n# Source the local override environment file if it exists\nif [ -f \"$XCODE_ENV_LOCAL\" ]; then\n  source \"$XCODE_ENV_LOCAL\"\nfi\n$NODE_BINARY \"$SRCROOT/../scripts/generateEntitlements.js\";\n\necho \"Linking completed.\"\n";
